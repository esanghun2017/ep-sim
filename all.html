<style>
:root{--bg:#F2F2F7;--fg:#1C1C1E;--mut:#8E8E93;--on:#1C1C1E}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
#top{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bg);z-index:4;transition:background .25s}
#vp{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;overflow:hidden}
#track{display:flex;height:100%;will-change:transform;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.pane{flex:0 0 100vw;width:100vw;height:100%;position:relative}
.pane iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font:15px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;pointer-events:none}
#dots{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(120,120,128,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:5;transition:opacity .4s}
#dots button{border:0;padding:0;width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5;cursor:pointer}
#dots button.on{background:var(--on);opacity:1;width:18px;border-radius:4px}
#dots.fade{opacity:.35}
</style>
</head>
<body>
<div id="top"></div>
<div id="vp"><div id="track"></div></div>
<div id="dots"></div>
<script>
const PAGES=[
 {name:'Portfolio',url:'https://esanghun2017.github.io/ep-sim/'},
 {name:'Brief',url:'https://esanghun2017.github.io/brief/'},
 {name:'성적표',url:'https://esanghun2017.github.io/reportcard/'}];
const track=document.getElementById('track'),dots=document.getElementById('dots');
let cur=0,W=innerWidth;const frames=[];
PAGES.forEach((p,i)=>{
 const pane=document.createElement('div');pane.className='pane';
 pane.innerHTML='<div class="ld">'+p.name+' 불러오는 중…</div>';
 const f=document.createElement('iframe');f.title=p.name;f.setAttribute('allow','clipboard-write');
 f.addEventListener('load',()=>{pane.querySelector('.ld')?.remove();hook(f);syncColor();});
 pane.appendChild(f);track.appendChild(pane);frames.push(f);
 const b=document.createElement('button');b.setAttribute('aria-label',p.name);b.onclick=()=>go(i);dots.appendChild(b);
});
frames[0].src=PAGES[0].url;
setTimeout(()=>frames.forEach((f,i)=>{if(i&&!f.src)f.src=PAGES[i].url;}),1200);
function place(dx,anim){track.style.transition=anim?'':'none';track.style.transform='translateX('+(-cur*W+(dx||0))+'px)';}
function go(i){cur=Math.max(0,Math.min(PAGES.length-1,i));if(!frames[cur].src)frames[cur].src=PAGES[cur].url;place(0,true);
 [...dots.children].forEach((b,j)=>b.classList.toggle('on',j===cur));dots.classList.remove('fade');clearTimeout(go._t);go._t=setTimeout(()=>dots.classList.add('fade'),1800);}
addEventListener('resize',()=>{W=innerWidth;place(0,false);});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
// A sideways drag that starts inside a sideways-scrolling table scrolls the table, not the page.
function hScrollable(el){for(;el&&el.nodeType===1;el=el.parentElement){if(el.scrollWidth>el.clientWidth+2){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true;}}return false;}
function hook(f){let d;try{d=f.contentDocument;}catch(e){return;}if(!d||d._hub)return;d._hub=1;
 let x0,y0,t0,mode,dx;
 d.addEventListener('touchstart',e=>{if(e.touches.length!==1){mode='no';return;}const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();dx=0;mode=hScrollable(e.target)?'no':null;},{passive:true});
 d.addEventListener('touchmove',e=>{if(mode==='no'||x0==null)return;const t=e.touches[0],ddx=t.clientX-x0,ddy=t.clientY-y0;
  if(mode==null){if(Math.abs(ddx)<10&&Math.abs(ddy)<10)return;mode=Math.abs(ddx)>Math.abs(ddy)*1.3?'h':'no';}
  if(mode==='h'){e.preventDefault();dx=ddx;if((cur===0&&dx>0)||(cur===PAGES.length-1&&dx<0))dx/=3;place(dx,false);}},{passive:false});
 const end=()=>{if(mode==='h'){const fast=Date.now()-t0<300&&Math.abs(dx)>40;if(dx<-W*0.22||(fast&&dx<0))go(cur+1);else if(dx>W*0.22||(fast&&dx>0))go(cur-1);else go(cur);}x0=null;mode=null;};
 d.addEventListener('touchend',end,{passive:true});d.addEventListener('touchcancel',end,{passive:true});
}
// Paint the strip behind the clock with the color of the page on screen (red when ep-sim shows a loss).
const meta=document.querySelector('meta[name="theme-color"]'),topEl=document.getElementById('top');
function pageColor(f){try{const d=f.contentDocument;if(!d||!d.body)return null;const w=f.contentWindow;
 for(const el of [d.body,d.documentElement]){const c=w.getComputedStyle(el).backgroundColor;if(c&&c!=='transparent'&&!/rgba\(.*,\s*0\)$/.test(c))return c;}}catch(e){}return null;}
function hex(c){const m=String(c).match(/\d+(\.\d+)?/g);if(!m||m.length<3||String(c)[0]==='#')return c;return '#'+m.slice(0,3).map(x=>Math.round(+x).toString(16).padStart(2,'0')).join('').toUpperCase();}
function syncColor(){const c=hex(pageColor(frames[cur])||'#F2F2F7');if(syncColor._c!==c){syncColor._c=c;topEl.style.background=c;document.body.style.background=c;document.documentElement.style.background=c;if(meta)meta.setAttribute('content',c);}}
setInterval(syncColor,700);
const _go=go;go=function(i){_go(i);setTimeout(syncColor,50);};
// Reload when a newer version of this page is published (GitHub can serve a cached copy for a while).
const HUBV='1.1.1';
function hubCheck(){if(!window.fetch)return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/Version (\d+\.\d+\.\d+)/);
 if(m&&m[1]!==HUBV){const k='hub_rl_'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(e){}location.replace(location.pathname+'?v='+m[1]);}}).catch(()=>{});}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){hubCheck();syncColor();}});
go(0);hubCheck();
